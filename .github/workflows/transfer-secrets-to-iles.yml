name: Transfer secrets to Iles

on:
  workflow_dispatch:

permissions: {}

jobs:
  release:
    name: Transfer release secrets
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_TOKEN: ${{ secrets.ILES_SECRET_TRANSFER_TOKEN }}
      TARGET_REPOSITORY: basique-industrie/iles
      APPLE_DEVELOPER_ID_APPLICATION_P12: ${{ secrets.APPLE_DEVELOPER_ID_APPLICATION_P12 }}
      APPLE_DEVELOPER_ID_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_PASSWORD }}
      APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
      APPLE_NOTARY_KEY_ISSUER: ${{ secrets.APPLE_NOTARY_KEY_ISSUER }}
      APPLE_NOTARY_KEY_P8: ${{ secrets.APPLE_NOTARY_KEY_P8 }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
    steps:
      - name: Transfer release environment secrets
        shell: bash
        run: |
          set -euo pipefail
          names=(
            APPLE_DEVELOPER_ID_APPLICATION_P12
            APPLE_DEVELOPER_ID_PASSWORD
            APPLE_NOTARY_KEY_ID
            APPLE_NOTARY_KEY_ISSUER
            APPLE_NOTARY_KEY_P8
            SPARKLE_PRIVATE_KEY
          )
          for name in "${names[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required source secret is unavailable: $name" >&2
              exit 1
            fi
            printf '%s' "${!name}" |
              gh secret set "$name" --repo "$TARGET_REPOSITORY" --env release
          done

  certificate-publishing:
    name: Transfer certificate-publishing secrets
    runs-on: ubuntu-latest
    environment: certificate-publishing
    env:
      GH_TOKEN: ${{ secrets.ILES_SECRET_TRANSFER_TOKEN }}
      TARGET_REPOSITORY: basique-industrie/iles
      CERTIFICATE_PRIVATE_KEY: ${{ secrets.CERTIFICATE_PRIVATE_KEY }}
    steps:
      - name: Transfer certificate-publishing environment secrets
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CERTIFICATE_PRIVATE_KEY" ]]; then
            echo 'Required source secret is unavailable: CERTIFICATE_PRIVATE_KEY' >&2
            exit 1
          fi
          printf '%s' "$CERTIFICATE_PRIVATE_KEY" |
            gh secret set CERTIFICATE_PRIVATE_KEY \
              --repo "$TARGET_REPOSITORY" \
              --env certificate-publishing
