<!doctype html><meta charset="utf-8"><title>Texture upload isolation check</title><body style="font:16px system-ui;background:#161817;color:#fff;padding:32px"><h1>Texture upload isolation check</h1><p id="result">Running…</p><script type="module">

 const outputs=[];
 for (const mode of ['mutable', 'immutable', 'partial']) for(const [account, replacement] of [['Original',null],['Account A',[9,8,7,6]],['Account B',[6,7,8,9]]]){

 }
